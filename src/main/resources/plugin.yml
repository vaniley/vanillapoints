name: VanillaPoints
version: ${project.version}
main: dev.vaniley.vanillapoints.VanillaPoints
api-version: '1.21'

commands:
  setspawn:
    description: Set the spawn point
    usage: /setspawn
  spawn:
    description: Get spawn coordinates
    usage: /spawn
    aliases: [s]
  sethome:
    description: Set your home point
    usage: /sethome
    aliases: [sh, setmyhome]
  home:
    description: Get your home coordinates
    usage: /home
    aliases: [h, myhome]
  setwarp:
    description: Set a warp point
    usage: /setwarp <name> [--icon <material>] [description...]
  warp:
    description: Get warp point coordinates or list warps
    usage: /warp [name]
    aliases: [w]
  warps:
    description: List available warps
    usage: /warps
  delwarp:
    description: Delete a warp point
    usage: /delwarp <name>
  vanillapoints:
    description: VanillaPoints admin command
    usage: /vanillapoints help [page] or /vanillapoints reload
    aliases: [vp]

permissions:
  vanillapoints.setspawn:
    description: Allows setting the spawn point
    default: op
  vanillapoints.setwarp:
    description: Allows setting warp points
    default: op
  vanillapoints.delwarp:
    description: Allows deleting warp points
    default: op
  vanillapoints.reload:
    description: Allows reloading VanillaPoints config, messages and data
    default: op
  vanillapoints.bypass.cooldown:
    description: Bypasses VanillaPoints cooldowns and rate limits
    default: op
  vanillapoints.bypass.confirm:
    description: Bypasses VanillaPoints deletion confirmations
    default: op
