name: VanillaPoints
version: ${project.version}
main: dev.vaniley.vanillapoints.VanillaPoints
api-version: '1.21'
softdepend: [PlaceholderAPI]

commands:
  setspawn:
    description: Set the spawn point
    usage: /setspawn
  spawn:
    description: Get spawn coordinates
    usage: /spawn
    aliases: [s]
  sethome:
    description: Set your home point
    usage: /sethome
    aliases: [sh, setmyhome]
  home:
    description: Get your home coordinates
    usage: /home [name]
    aliases: [h, myhome]
  homes:
    description: List your homes
    usage: /homes
  delhome:
    description: Delete one of your homes
    usage: /delhome <name>
  setwarp:
    description: Set a warp point
    usage: /setwarp <name> [--icon <material>] [description...]
  warp:
    description: Get warp point coordinates or list warps
    usage: /warp [name]
    aliases: [w]
  warps:
    description: List available warps
    usage: /warps
  delwarp:
    description: Delete a warp point
    usage: /delwarp <name>
  vanillapoints:
    description: VanillaPoints admin command
    usage: /vanillapoints help [page] or /vanillapoints reload
    aliases: [vp]

permissions:
  vanillapoints.setspawn:
    description: Allows setting the spawn point
    default: op
  vanillapoints.setwarp:
    description: Allows setting warp points
    default: op
  vanillapoints.delwarp:
    description: Allows deleting warp points
    default: op
  vanillapoints.reload:
    description: Allows reloading VanillaPoints config, messages and data
    default: op
  vanillapoints.bypass.cooldown:
    description: Bypasses VanillaPoints cooldowns and rate limits
    default: op
  vanillapoints.bypass.confirm:
    description: Bypasses VanillaPoints deletion confirmations
    default: op
  vanillapoints.homes.vip:
    description: Example permission for 5 homes; configure homes.limits-by-permission to change it
    default: false
  vanillapoints.homes.premium:
    description: Example permission for 10 homes; configure homes.limits-by-permission to change it
    default: false
  vanillapoints.lang.en:
    description: Uses English messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.ru:
    description: Uses Russian messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.uk:
    description: Uses Ukrainian messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.es:
    description: Uses Spanish messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.de:
    description: Uses German messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.fr:
    description: Uses French messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.zh:
    description: Uses Simplified Chinese messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.ja:
    description: Uses Japanese messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.pt:
    description: Uses Portuguese messages when per-player language permissions are enabled
    default: false
  vanillapoints.lang.pl:
    description: Uses Polish messages when per-player language permissions are enabled
    default: false
