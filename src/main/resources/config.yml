settings:
  # Available bundled languages: en, ru, uk, es, de, fr, zh, ja, pt, pl.
  language: en
  # When enabled, players with vanillapoints.lang.<code> receive messages in that language.
  per-player-permissions: false
  # When enabled, changes are queued for async persistence immediately after commands/API mutations.
  # When disabled, data is flushed during /vp reload and plugin shutdown.
  save-immediately: true
  normalize-to-block: true
  copy-format: '{x} {y} {z}'

placeholders:
  empty-value: ''
  warp-list-separator: ', '

homes:
  default-limit: 1
  operator-unlimited: true
  limits-by-permission:
    vanillapoints.homes.vip: 5
    vanillapoints.homes.premium: 10

spawn:
  # When true, /setspawn and /spawn operate on the player's current world. When false a single global spawn is used.
  per-world: false

info-card:
  enabled: true
  show-biome: true
  show-time: false
  show-weather: false
  show-creator: true
  show-age: false
  lines:
    - header
    - coordinates
    - biome
    - time
    - weather
    - creator
    - age

storage:
  backend: sqlite # yaml | sqlite | mysql
  migrate-yaml-on-first-run: true
  # SQL pool startup/health-check timeouts. Invalid SQL configuration disables the plugin with a clear log entry.
  connection-timeout-ms: 10000
  validation-timeout-ms: 5000
  sqlite:
    file: storage.db
  mysql:
    host: localhost
    port: 3306
    database: vanillapoints
    username: root
    password: ''
    pool-size: 8
    use-ssl: true

feedback:
  sounds: true
  particles: true
  events:
    home-set:
      sound: ENTITY_PLAYER_LEVELUP
      volume: 0.6
      pitch: 1.4
      particle: HAPPY_VILLAGER
      count: 12
    warp-set:
      sound: BLOCK_BEACON_ACTIVATE
      volume: 0.8
      pitch: 1.0
      particle: END_ROD
      count: 16
    spawn-set:
      sound: BLOCK_BEACON_POWER_SELECT
      volume: 0.7
      pitch: 1.0
      particle: HAPPY_VILLAGER
      count: 12

help:
  per-page: 7
  show-hidden-commands: false

cooldowns:
  default: 2s
  per-command:
    home: 3s
    warp: 2s
    sethome: 10s
    setwarp: 10s
  bypass-permission: vanillapoints.bypass.cooldown

rate-limit:
  window: 60s
  max-commands: 30

safety:
  confirm-deletions: true
  confirm-ttl: 30s
  bypass-permission: vanillapoints.bypass.confirm

# Anonymous usage metrics via bStats. Register the project first, then set its numeric service id.
metrics:
  enabled: false
  service-id: 0

update-checker:
  enabled: true
  # SpigotMC resource id (preferred). Leave 0 to use the custom url below instead, or disable the checker.
  spigot-resource-id: 0
  # Optional custom endpoint that returns the latest version as plain text. Ignored when spigot-resource-id > 0.
  url: ''
