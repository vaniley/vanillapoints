settings:
  # Available bundled languages: en, ru.
  language: en
  # When enabled, changes are queued for async persistence immediately after commands/API mutations.
  # When disabled, data is flushed during /vp reload and plugin shutdown.
  save-immediately: true
  normalize-to-block: true
  copy-format: '{x} {y} {z}'

storage:
  backend: yaml # yaml | sqlite | mysql
  migrate-yaml-on-first-run: true
  sqlite:
    file: storage.db
  mysql:
    host: localhost
    port: 3306
    database: vanillapoints
    username: root
    password: ''
    pool-size: 8
    use-ssl: true

feedback:
  sounds: true
  particles: true
  events:
    home-set:
      sound: ENTITY_PLAYER_LEVELUP
      volume: 0.6
      pitch: 1.4
      particle: HAPPY_VILLAGER
      count: 12
    warp-set:
      sound: BLOCK_BEACON_ACTIVATE
      volume: 0.8
      pitch: 1.0
      particle: END_ROD
      count: 16

help:
  per-page: 7
  show-hidden-commands: false

cooldowns:
  default: 2s
  per-command:
    home: 3s
    warp: 2s
    sethome: 10s
    setwarp: 10s
  bypass-permission: vanillapoints.bypass.cooldown

rate-limit:
  window: 60s
  max-commands: 30

safety:
  confirm-deletions: true
  confirm-ttl: 30s
  bypass-permission: vanillapoints.bypass.confirm
